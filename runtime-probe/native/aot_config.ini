[mono]
; The runtime host changes the working directory to the virtual package root
; ("cmz:/"), so Mono's paths must be absolute RomFS paths.
icu = romfs:/icudt77l.dat
assembly_dir = romfs:/
config_dir = romfs:/
default_assembly = romfs:/program.dll

[nx]
; mono cannot reload in the same process, so exit the whole applet cleanly
; instead of returning to the homebrew menu in a half-torn-down state.
exit_process_on_end = true
